<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="8" fill="#C9A34C"/>
<text x="72" y="132" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#AA5A16" letter-spacing="3">ANTES DE ASSINAR</text>
<text x="72" y="220" font-family="Helvetica,Arial,sans-serif" font-size="62" font-weight="bold" fill="#1A2433">Pergunte estas cinco</text>
<text x="72" y="292" font-family="Helvetica,Arial,sans-serif" font-size="62" font-weight="bold" fill="#1A2433">coisas.</text>
<rect x="72" y="380" width="120" height="5" fill="#C9A34C"/>
<circle cx="88" cy="450" r="7" fill="#C9A34C"/>
<text x="120" y="460" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">Qual é o percentual da taxa de</text>
<text x="120" y="505" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">administração e sobre o que ela</text>
<text x="120" y="550" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">incide?</text>
<circle cx="88" cy="611" r="7" fill="#C9A34C"/>
<text x="120" y="621" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">A taxa é reajustada durante o prazo?</text>
<text x="120" y="666" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">Com que índice?</text>
<circle cx="88" cy="727" r="7" fill="#C9A34C"/>
<text x="120" y="737" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">Quais fundos e seguros são</text>
<text x="120" y="782" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">obrigatórios — e quanto somam por mês?</text>
<circle cx="88" cy="843" r="7" fill="#C9A34C"/>
<text x="120" y="853" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">Qual o custo total até o fim do prazo,</text>
<text x="120" y="898" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">com todas as taxas?</text>
<circle cx="88" cy="959" r="7" fill="#C9A34C"/>
<text x="120" y="969" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">Existe multa ou taxa se eu desistir ou</text>
<text x="120" y="1014" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">antecipar o pagamento?</text>
<rect x="72" y="1067" width="6" height="6" fill="#C9A34C"/>
<text x="94" y="1091" font-family="Helvetica,Arial,sans-serif" font-size="33" font-weight="bold" fill="#AA5A16">Se a resposta for 'depois você vê no</text>
<text x="94" y="1135" font-family="Helvetica,Arial,sans-serif" font-size="33" font-weight="bold" fill="#AA5A16">contrato', não é resposta.</text>
<text x="72" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75">VTR CONSÓRCIOS</text>
<text x="1008" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75" text-anchor="end">6/8</text>
</svg>