<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16" letter-spacing="4">SEM LETRA MIÚDA</text>
<text x="80" y="480" font-family="Helvetica,Arial,sans-serif" font-size="96" font-weight="bold" fill="#1A2433">Eu te mostro</text>
<text x="80" y="604" font-family="Helvetica,Arial,sans-serif" font-size="96" font-weight="bold" fill="#1A2433">as duas</text>
<text x="80" y="728" font-family="Helvetica,Arial,sans-serif" font-size="96" font-weight="bold" fill="#1A2433">parcelas.</text>
<rect x="80" y="860" width="230" height="9" fill="#C9A34C"/>
<text x="80" y="962" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">A que você paga agora e a que</text>
<text x="80" y="1018" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">volta depois da contemplação.</text>
<text x="80" y="1100" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">Sem prometer data e sem esconder</text>
<text x="80" y="1156" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">número.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>