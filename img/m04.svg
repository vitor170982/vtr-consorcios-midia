<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16" letter-spacing="4">QUEM PODE FAZER</text>
<text x="80" y="490" font-family="Helvetica,Arial,sans-serif" font-size="88" font-weight="bold" fill="#1A2433">Você não precisa</text>
<text x="80" y="602" font-family="Helvetica,Arial,sans-serif" font-size="88" font-weight="bold" fill="#1A2433">estar no Brasil.</text>
<rect x="80" y="720" width="230" height="9" fill="#C9A34C"/>
<text x="80" y="824" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">Contrato assinado digitalmente,</text>
<text x="80" y="880" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">pagamento por remessa e</text>
<text x="80" y="936" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">acompanhamento pelo app.</text>
<text x="80" y="1018" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">Brasileiro morando fora pode. Isso</text>
<text x="80" y="1074" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">não muda a regra do consórcio.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>