<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="12" fill="#B3202A"/>
<rect x="0" y="12" width="1080" height="5" fill="#C9A34C"/>
<text x="72" y="140" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#AA5A16" letter-spacing="3">LEIA ANTES DE SE ANIMAR</text>
<text x="72" y="250" font-family="Helvetica,Arial,sans-serif" font-size="62" font-weight="bold" fill="#1A2433">Os 60% valem</text>
<text x="72" y="322" font-family="Helvetica,Arial,sans-serif" font-size="62" font-weight="bold" fill="#1A2433">até a contemplação.</text>
<text x="72" y="394" font-family="Helvetica,Arial,sans-serif" font-size="62" font-weight="bold" fill="#1A2433">Depois, a parcela</text>
<text x="72" y="466" font-family="Helvetica,Arial,sans-serif" font-size="62" font-weight="bold" fill="#1A2433">volta ao normal.</text>
<rect x="72" y="552" width="120" height="5" fill="#C9A34C"/>
<circle cx="88" cy="622" r="7" fill="#C9A34C"/>
<text x="120" y="634" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#3A4553">Contemplado, você passa a pagar a parcela</text>
<text x="120" y="678" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#3A4553">cheia pelos meses restantes.</text>
<circle cx="88" cy="736" r="7" fill="#C9A34C"/>
<text x="120" y="748" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#3A4553">O total do contrato não muda. O que muda é</text>
<text x="120" y="792" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#3A4553">quando você paga.</text>
<circle cx="88" cy="850" r="7" fill="#C9A34C"/>
<text x="120" y="862" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#3A4553">É fôlego agora — não desconto no fim.</text>
<text x="72" y="946" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#8B93A0">Ação em grupos específicos definidos pela Ademicon,</text>
<text x="72" y="978" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#8B93A0">enquanto houver cotas. Contemplação por sorteio ou lance —</text>
<text x="72" y="1010" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#8B93A0">ninguém pode prometer data.</text>
<text x="72" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.72">VTR CONSÓRCIOS</text>
<text x="1008" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.72" text-anchor="end">3/7</text>
</svg>