<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16" letter-spacing="4">SE FAZ SENTIDO</text>
<text x="80" y="440" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#1A2433">Estes três sinais.</text>
<circle cx="96" cy="538" r="8" fill="#C9A34C"/>
<text x="130" y="552" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">Você tem uma parcela que não aperta o mês.</text>
<circle cx="96" cy="632" r="8" fill="#C9A34C"/>
<text x="130" y="646" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">Está pensando em comprar no Brasil em</text>
<text x="130" y="692" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">um a três anos.</text>
<circle cx="96" cy="758" r="8" fill="#C9A34C"/>
<text x="130" y="772" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">Quer patrimônio, não quantidade de</text>
<text x="130" y="818" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">bem financiado.</text>
<text x="80" y="918" font-family="Helvetica,Arial,sans-serif" font-size="38" font-weight="bold" fill="#AA5A16">Se marcou os três, vale uma conversa.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>