<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="8" fill="#C9A34C"/>
<text x="72" y="150" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" fill="#C9A34C" letter-spacing="3">O CUSTO QUE NINGUÉM EXPLICA</text>
<text x="72" y="300" font-family="Helvetica,Arial,sans-serif" font-size="88" font-weight="bold" fill="#FFFFFF">Consórcio não</text>
<text x="72" y="400" font-family="Helvetica,Arial,sans-serif" font-size="88" font-weight="bold" fill="#FFFFFF">tem juros.</text>
<text x="72" y="500" font-family="Helvetica,Arial,sans-serif" font-size="88" font-weight="bold" fill="#FFFFFF">Mas tem um custo.</text>
<rect x="72" y="610" width="164" height="6" fill="#C9A34C"/>
<text x="72" y="686" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">E quase ninguém te conta qual é. Vou</text>
<text x="72" y="740" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">te mostrar onde ele aparece no</text>
<text x="72" y="794" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">contrato.</text>
<rect x="72" y="1090" width="330" height="70" rx="35" fill="#C9A34C"/>
<text x="108" y="1137" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#0C2C27">Arrasta →</text>
<text x="72" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75">VTR CONSÓRCIOS</text>
<text x="1008" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75" text-anchor="end">1/8</text>
</svg>