<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C" letter-spacing="4">SEM LETRA MIÚDA</text>
<text x="80" y="450" font-family="Helvetica,Arial,sans-serif" font-size="50" fill="#FFFFFF">O que está na tabela</text>
<text x="80" y="515" font-family="Helvetica,Arial,sans-serif" font-size="50" fill="#FFFFFF">é o que você paga.</text>
<text x="80" y="630" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">A parcela reduzida vale até a</text>
<text x="80" y="680" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">contemplação. Depois, ela volta ao</text>
<text x="80" y="730" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">valor cheio — e isso está escrito.</text>
<text x="80" y="840" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">Quem te mostra a tabela inteira</text>
<text x="80" y="890" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">não tem nada a esconder.</text>
<text x="80" y="1000" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#C9A34C">Sujeito a grupos e cotas disponíveis.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#969690" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>
