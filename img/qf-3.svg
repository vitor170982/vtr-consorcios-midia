<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="12" fill="#C9A34C"/>
<text x="72" y="140" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#AA5A16" letter-spacing="3">ANTES DE VOCÊ SE ANIMAR</text>
<text x="72" y="250" font-family="Helvetica,Arial,sans-serif" font-size="66" font-weight="bold" fill="#1A2433">O que ninguém</text>
<text x="72" y="328" font-family="Helvetica,Arial,sans-serif" font-size="66" font-weight="bold" fill="#1A2433">te conta sobre</text>
<text x="72" y="406" font-family="Helvetica,Arial,sans-serif" font-size="66" font-weight="bold" fill="#1A2433">essa parcela.</text>
<rect x="72" y="498" width="120" height="5" fill="#C9A34C"/>
<circle cx="88" cy="572" r="7" fill="#C9A34C"/>
<text x="120" y="584" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#1A2433">Os R$ 875 valem até a contemplação.</text>
<text x="120" y="626" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#3A4553">Depois de contemplado, a parcela volta ao valor</text>
<text x="120" y="662" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#3A4553">cheio — R$ 2.188,65 no caso de R$ 300 mil.</text>
<circle cx="88" cy="712" r="7" fill="#C9A34C"/>
<text x="120" y="724" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#1A2433">O total do contrato não muda.</text>
<text x="120" y="766" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#3A4553">O que muda é quando você paga. É fôlego agora, não</text>
<text x="120" y="802" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#3A4553">desconto no fim.</text>
<circle cx="88" cy="852" r="7" fill="#C9A34C"/>
<text x="120" y="864" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#1A2433">Não existe data para contemplar.</text>
<text x="120" y="906" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#3A4553">É sorteio ou lance. Ninguém pode prometer mês — e</text>
<text x="120" y="942" font-family="Helvetica,Arial,sans-serif" font-size="27" fill="#3A4553">quem promete está mentindo.</text>
<text x="72" y="1278" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
<text x="1008" y="1278" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.7" text-anchor="end">3/6</text>
</svg>