<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16" letter-spacing="4">A PERGUNTA CERTA</text>
<text x="80" y="480" font-family="Helvetica,Arial,sans-serif" font-size="88" font-weight="bold" fill="#1A2433">Você tem prazo</text>
<text x="80" y="594" font-family="Helvetica,Arial,sans-serif" font-size="88" font-weight="bold" fill="#1A2433">ou tem pressa?</text>
<rect x="80" y="716" width="230" height="9" fill="#C9A34C"/>
<text x="80" y="818" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">Prazo é planejamento. Pressa é</text>
<text x="80" y="874" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">pagar o preço de não ter planejado</text>
<text x="80" y="930" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">antes.</text>
<text x="80" y="1024" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#AA5A16">Quem decide com prazo escolhe</text>
<text x="80" y="1074" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#AA5A16">melhor.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>