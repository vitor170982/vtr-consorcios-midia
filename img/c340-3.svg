<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="12" fill="#C9A34C"/>
<text x="80" y="380" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#C9A34C" letter-spacing="5">SEM JUROS. SEM ENTRADA.</text>
<text x="80" y="560" font-family="Helvetica,Arial,sans-serif" font-size="96" font-weight="bold" fill="#FFFFFF">Você não precisa</text>
<text x="80" y="672" font-family="Helvetica,Arial,sans-serif" font-size="96" font-weight="bold" fill="#FFFFFF">ter os R$ 100 mil.</text>
<text x="80" y="784" font-family="Helvetica,Arial,sans-serif" font-size="96" font-weight="bold" fill="#FFFFFF">Precisa começar.</text>
<rect x="80" y="850" width="240" height="9" fill="#C9A34C"/>
<text x="80" y="990" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">É assim que se compra imóvel</text>
<text x="80" y="1046" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">morando fora: parcelando aos</text>
<text x="80" y="1102" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">poucos, sem financiamento e</text>
<text x="80" y="1158" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">sem juros.</text>
<rect x="80" y="1400" width="8" height="150" fill="#C9A34C"/>
<text x="112" y="1430" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#9AA096">Simulação com premissas do exemplo oficial:</text>
<text x="112" y="1464" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#9AA096">crédito R$ 100 mil, 219 meses, taxa 24%.</text>
<text x="112" y="1498" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#9AA096">Parcela reduzida do Plano 50 (50% do fundo</text>
<text x="112" y="1532" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#9AA096">comum + taxas). Volta ao valor cheio após a</text>
<text x="112" y="1566" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#9AA096">contemplação. Sujeito a contemplação e a</text>
<text x="112" y="1600" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#9AA096">grupos disponíveis.</text>
<text x="80" y="1700" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#969690" opacity="0.8">VTR CONSÓRCIOS</text>
</svg>