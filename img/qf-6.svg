<text x="72" y="300" font-family="Helvetica,Arial,sans-serif" font-size="92" font-weight="bold" fill="#FFFFFF">Qual é a</text>
<text x="72" y="404" font-family="Helvetica,Arial,sans-serif" font-size="92" font-weight="bold" fill="#FFFFFF">sua conta?</text>
<rect x="72" y="516" width="190" height="7" fill="#C9A34C"/>
<text x="72" y="608" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#D6D2C8">Então me conta nos comentários: você</text>
<text x="72" y="656" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#D6D2C8">já tinha pensado nessa conta do</text>
<text x="72" y="704" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#D6D2C8">aluguel?</text>
<text x="72" y="792" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#C9A34C">E se quiser ver a simulação com o valor</text>
<text x="72" y="836" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#C9A34C">do SEU imóvel, me chama no WhatsApp:</text>
<text x="72" y="880" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#C9A34C">link na bio.</text>
