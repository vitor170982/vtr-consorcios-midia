<text x="104" y="1078" font-family="Helvetica,Arial,sans-serif" font-size="31" font-weight="bold" fill="#0C2C27">WhatsApp na bio</text>
<text x="72" y="1160" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#8C9187">Ademicon · autorizada pelo Banco Central do Brasil</text>
