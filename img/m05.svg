<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C" letter-spacing="4">O ERRO MAIS COMUM</text>
<text x="80" y="490" font-family="Helvetica,Arial,sans-serif" font-size="92" font-weight="bold" fill="#FFFFFF">Julgar pela</text>
<text x="80" y="612" font-family="Helvetica,Arial,sans-serif" font-size="92" font-weight="bold" fill="#FFFFFF">parcela.</text>
<rect x="80" y="740" width="230" height="9" fill="#C9A34C"/>
<text x="80" y="844" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">Duas propostas com a mesma</text>
<text x="80" y="900" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">parcela podem ter custo total</text>
<text x="80" y="956" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">completamente diferente.</text>
<text x="80" y="1038" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">O número que importa é quanto você</text>
<text x="80" y="1094" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">paga do primeiro ao último mês.</text>
<text x="80" y="1186" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#C9A34C">Peça o custo total por escrito.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#969690" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>