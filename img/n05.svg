<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16" letter-spacing="4">TRANSPARÊNCIA</text>
<text x="80" y="490" font-family="Helvetica,Arial,sans-serif" font-size="84" font-weight="bold" fill="#1A2433">Eu prefiro</text>
<text x="80" y="597" font-family="Helvetica,Arial,sans-serif" font-size="84" font-weight="bold" fill="#1A2433">que você não</text>
<text x="80" y="704" font-family="Helvetica,Arial,sans-serif" font-size="84" font-weight="bold" fill="#1A2433">faça.</text>
<rect x="80" y="817" width="230" height="9" fill="#C9A34C"/>
<text x="80" y="921" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">Se o objetivo é ter o imóvel em</text>
<text x="80" y="977" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">três meses, consórcio é a escolha</text>
<text x="80" y="1033" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">errada.</text>
<text x="80" y="1115" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">Se é comprar em dois ou três anos</text>
<text x="80" y="1171" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">sem juros, faz sentido.</text>
<text x="80" y="1263" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#AA5A16">Meu trabalho não é vender pra você —</text>
<text x="80" y="1313" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#AA5A16">é te dizer se serve.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>