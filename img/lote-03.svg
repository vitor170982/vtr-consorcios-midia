<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16" letter-spacing="4">FAÇA ESSA CONTA</text>
<text x="80" y="440" font-family="Helvetica,Arial,sans-serif" font-size="44" fill="#3A4553">R$ 1.500 de aluguel por mês</text>
<text x="70" y="666" font-family="Helvetica,Arial,sans-serif" font-size="190" font-weight="bold" fill="#1A2433">R$ 18.000</text>
<text x="80" y="726" font-family="Helvetica,Arial,sans-serif" font-size="46" font-weight="bold" fill="#AA5A16">por ano</text>
<text x="80" y="816" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">Em cinco anos morando fora: R$ 90</text>
<text x="80" y="866" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">mil que não viraram nada.</text>
<text x="80" y="940" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">Aluguel é necessidade. Mas é</text>
<text x="80" y="990" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">dinheiro que vai e não volta.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>