<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="8" fill="#C9A34C"/>
<text x="72" y="132" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#AA5A16" letter-spacing="3">O ERRO COMUM</text>
<text x="72" y="220" font-family="Helvetica,Arial,sans-serif" font-size="62" font-weight="bold" fill="#1A2433">Julgar pela parcela, não</text>
<text x="72" y="292" font-family="Helvetica,Arial,sans-serif" font-size="62" font-weight="bold" fill="#1A2433">pelo total.</text>
<rect x="72" y="380" width="120" height="5" fill="#C9A34C"/>
<text x="72" y="446" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">Uma parcela de R$ 800 que parece barata</text>
<text x="72" y="496" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">pode custar mais, no fim, que uma de R$</text>
<text x="72" y="546" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">950 com taxa menor e prazo menor.</text>
<text x="72" y="620" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">O número que importa é um só: quanto você</text>
<text x="72" y="670" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">paga no fim, do primeiro ao último mês.</text>
<text x="72" y="744" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">Peça esse número por escrito antes de</text>
<text x="72" y="794" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">assinar qualquer coisa.</text>
<rect x="72" y="852" width="6" height="6" fill="#C9A34C"/>
<text x="94" y="876" font-family="Helvetica,Arial,sans-serif" font-size="33" font-weight="bold" fill="#AA5A16">Parcela pequena com custo total alto é a</text>
<text x="94" y="920" font-family="Helvetica,Arial,sans-serif" font-size="33" font-weight="bold" fill="#AA5A16">forma mais cara de economizar.</text>
<text x="72" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75">VTR CONSÓRCIOS</text>
<text x="1008" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75" text-anchor="end">7/8</text>
</svg>