<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C" letter-spacing="4">CONSÓRCIO NÃO É INVESTIMENTO</text>
<text x="80" y="490" font-family="Helvetica,Arial,sans-serif" font-size="88" font-weight="bold" fill="#FFFFFF">É compra</text>
<text x="80" y="602" font-family="Helvetica,Arial,sans-serif" font-size="88" font-weight="bold" fill="#FFFFFF">planejada.</text>
<rect x="80" y="720" width="230" height="9" fill="#C9A34C"/>
<text x="80" y="824" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">Investimento rende. Consórcio</text>
<text x="80" y="880" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">compra.</text>
<text x="80" y="962" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">Quem confunde os dois se frustra:</text>
<text x="80" y="1018" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">espera lucro de algo que é</text>
<text x="80" y="1074" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">planejamento de aquisição.</text>
<text x="80" y="1166" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#C9A34C">Se te venderam como investimento, te</text>
<text x="80" y="1216" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#C9A34C">venderam errado.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#969690" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>