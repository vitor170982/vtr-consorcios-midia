<text x="72" y="900" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C">Salva este post. Quando você for decidir</text>
<text x="72" y="946" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C">de verdade, esses números vão fazer</text>
