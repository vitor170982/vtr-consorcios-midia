<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="8" fill="#C9A34C"/>
<text x="72" y="132" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#AA5A16" letter-spacing="3">ONDE ELA APARECE</text>
<text x="72" y="220" font-family="Helvetica,Arial,sans-serif" font-size="62" font-weight="bold" fill="#1A2433">Ela está dentro da sua</text>
<text x="72" y="292" font-family="Helvetica,Arial,sans-serif" font-size="62" font-weight="bold" fill="#1A2433">parcela.</text>
<rect x="72" y="380" width="120" height="5" fill="#C9A34C"/>
<text x="72" y="446" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">Sua parcela mensal não é só o valor do bem</text>
<text x="72" y="496" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">dividido pelo prazo. Ela tem três pedaços:</text>
<text x="72" y="570" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">1. Fundo comum — o dinheiro que paga a sua</text>
<text x="72" y="620" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">carta de crédito.</text>
<text x="72" y="694" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">2. Taxa de administração — o pagamento do</text>
<text x="72" y="744" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">serviço.</text>
<text x="72" y="818" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">3. Fundos e seguros obrigatórios,</text>
<text x="72" y="868" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">definidos em contrato.</text>
<rect x="72" y="926" width="6" height="6" fill="#C9A34C"/>
<text x="94" y="950" font-family="Helvetica,Arial,sans-serif" font-size="33" font-weight="bold" fill="#AA5A16">Olhe o contrato e veja esses três separados.</text>
<text x="94" y="994" font-family="Helvetica,Arial,sans-serif" font-size="33" font-weight="bold" fill="#AA5A16">É seu direito.</text>
<text x="72" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75">VTR CONSÓRCIOS</text>
<text x="1008" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75" text-anchor="end">3/8</text>
</svg>