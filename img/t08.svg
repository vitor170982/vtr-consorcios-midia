<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C" letter-spacing="4">O CUSTO DE ESPERAR</text>
<text x="80" y="440" font-family="Helvetica,Arial,sans-serif" font-size="44" fill="#D6D2C8">Cinco anos pagando</text>
<text x="70" y="656" font-family="Helvetica,Arial,sans-serif" font-size="180" font-weight="bold" fill="#FFFFFF">R$ 90</text>
<text x="80" y="716" font-family="Helvetica,Arial,sans-serif" font-size="46" font-weight="bold" fill="#C9A34C">mil de aluguel</text>
<text x="80" y="806" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">Com R$ 1.500 de aluguel, cinco anos</text>
<text x="80" y="856" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">somam R$ 90 mil.</text>
<text x="80" y="930" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">Nada disso voltou. Não virou</text>
<text x="80" y="980" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">patrimônio, não virou nada.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#969690" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>