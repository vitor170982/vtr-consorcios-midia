<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C" letter-spacing="4">TRÊS PERGUNTAS</text>
<text x="80" y="440" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#FFFFFF">Antes de decidir.</text>
<circle cx="96" cy="538" r="8" fill="#C9A34C"/>
<text x="130" y="552" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">Quanto eu já paguei de aluguel na vida?</text>
<circle cx="96" cy="618" r="8" fill="#C9A34C"/>
<text x="130" y="632" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">Se eu parar de trabalhar hoje, quantos</text>
<text x="130" y="678" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">meses eu aguento?</text>
<circle cx="96" cy="744" r="8" fill="#C9A34C"/>
<text x="130" y="758" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">Em 10 anos, o que eu vou ter construído</text>
<text x="130" y="804" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">aqui fora?</text>
<text x="80" y="904" font-family="Helvetica,Arial,sans-serif" font-size="38" font-weight="bold" fill="#C9A34C">Nenhuma delas é sobre consórcio. É</text>
<text x="80" y="952" font-family="Helvetica,Arial,sans-serif" font-size="38" font-weight="bold" fill="#C9A34C">sobre planejamento.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#969690" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>