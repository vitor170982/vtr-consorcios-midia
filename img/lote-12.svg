<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C" letter-spacing="4">A VIRADA</text>
<text x="80" y="480" font-family="Helvetica,Arial,sans-serif" font-size="74" font-weight="bold" fill="#FFFFFF">O mesmo dinheiro.</text>
<text x="80" y="576" font-family="Helvetica,Arial,sans-serif" font-size="74" font-weight="bold" fill="#FFFFFF">Um vira aluguel.</text>
<text x="80" y="672" font-family="Helvetica,Arial,sans-serif" font-size="74" font-weight="bold" fill="#FFFFFF">O outro vira</text>
<text x="80" y="768" font-family="Helvetica,Arial,sans-serif" font-size="74" font-weight="bold" fill="#FFFFFF">patrimônio.</text>
<rect x="80" y="872" width="230" height="9" fill="#C9A34C"/>
<text x="80" y="974" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#FFFFFF">R$ 875,46 por mês compra um</text>
<text x="80" y="1030" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#FFFFFF">crédito de R$ 300 mil para você</text>
<text x="80" y="1086" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#FFFFFF">comprar no Brasil.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#969690" opacity="0.7">VTR CONSÓRCIOS</text>
