<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="9" fill="#C9A34C"/>
<text x="72" y="130" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#AA5A16" letter-spacing="3">FAÇA ESSA CONTA</text>
<text x="72" y="230" font-family="Helvetica,Arial,sans-serif" font-size="64" font-weight="bold" fill="#1A2433">Quanto já passou</text>
<text x="72" y="306" font-family="Helvetica,Arial,sans-serif" font-size="64" font-weight="bold" fill="#1A2433">pela sua mão?</text>
<rect x="72" y="392" width="120" height="5" fill="#C9A34C"/>
<text x="72" y="492" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">Dez anos nos Estados Unidos. Um salário que</text>
<text x="72" y="540" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">no Brasil seria alto.</text>
<text x="72" y="614" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">Você pagou aluguel. Pagou carro. Pagou as</text>
<text x="72" y="662" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">contas. Mandou dinheiro para a família.</text>
<text x="72" y="736" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">E tudo isso foi embora — o aluguel não</text>
<text x="72" y="784" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">volta, o carro desvaloriza.</text>
<rect x="72" y="842" width="6" height="6" fill="#C9A34C"/>
<text x="94" y="872" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#AA5A16">Não é falta de dinheiro. É falta de um lugar</text>
<text x="94" y="916" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#AA5A16">fixo para ele ficar.</text>
<text x="72" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.72">VTR CONSÓRCIOS</text>
<text x="1008" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.72" text-anchor="end">2/7</text>
</svg>