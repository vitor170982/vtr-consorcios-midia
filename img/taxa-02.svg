<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="8" fill="#C9A34C"/>
<text x="72" y="132" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#AA5A16" letter-spacing="3">O QUE É</text>
<text x="72" y="220" font-family="Helvetica,Arial,sans-serif" font-size="62" font-weight="bold" fill="#1A2433">Taxa de administração é</text>
<text x="72" y="292" font-family="Helvetica,Arial,sans-serif" font-size="62" font-weight="bold" fill="#1A2433">o preço do serviço.</text>
<rect x="72" y="380" width="120" height="5" fill="#C9A34C"/>
<text x="72" y="446" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">A administradora monta o grupo, faz a</text>
<text x="72" y="496" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">assembleia, cobra as parcelas, controla a</text>
<text x="72" y="546" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">contabilidade e responde pela prestação de</text>
<text x="72" y="596" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">contas.</text>
<text x="72" y="670" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">Isso é trabalho — e trabalho tem custo. A</text>
<text x="72" y="720" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">taxa de administração remunera esse</text>
<text x="72" y="770" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">trabalho.</text>
<rect x="72" y="828" width="6" height="6" fill="#C9A34C"/>
<text x="94" y="852" font-family="Helvetica,Arial,sans-serif" font-size="33" font-weight="bold" fill="#AA5A16">É cobrada uma vez, diluída nas parcelas. Não</text>
<text x="94" y="896" font-family="Helvetica,Arial,sans-serif" font-size="33" font-weight="bold" fill="#AA5A16">é dívida que cresce.</text>
<text x="72" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75">VTR CONSÓRCIOS</text>
<text x="1008" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75" text-anchor="end">2/8</text>
</svg>