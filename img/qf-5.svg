<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="12" fill="#C9A34C"/>
<text x="72" y="140" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#AA5A16" letter-spacing="3">FAÇA A CONTA</text>
<text x="72" y="250" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#1A2433">Quanto você já</text>
<text x="72" y="330" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#1A2433">pagou de aluguel</text>
<text x="72" y="410" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#1A2433">na vida?</text>
<rect x="72" y="504" width="120" height="5" fill="#C9A34C"/>
<text x="72" y="590" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">Se você mora fora há cinco anos e pagou</text>
<text x="72" y="636" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">1.500 por mês, já foram 90 mil.</text>
<text x="72" y="712" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">Nada disso voltou. Não virou patrimônio, não</text>
<text x="72" y="758" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">virou nada.</text>
<text x="72" y="834" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">Com consórcio, o dinheiro sai do mesmo jeito</text>
<text x="72" y="880" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">todo mês — mas com destino.</text>
<rect x="72" y="946" width="6" height="6" fill="#C9A34C"/>
<text x="94" y="976" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16">A diferença não é quanto você paga. É para</text>
<text x="94" y="1022" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16">onde vai.</text>
<text x="72" y="1278" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
<text x="1008" y="1278" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.7" text-anchor="end">5/6</text>
</svg>