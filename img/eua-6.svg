<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="9" fill="#C9A34C"/>
<text x="72" y="130" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#AA5A16" letter-spacing="3">A CONTA DO TEMPO</text>
<text x="72" y="230" font-family="Helvetica,Arial,sans-serif" font-size="70" font-weight="bold" fill="#1A2433">O melhor dia</text>
<text x="72" y="310" font-family="Helvetica,Arial,sans-serif" font-size="70" font-weight="bold" fill="#1A2433">para começar</text>
<text x="72" y="390" font-family="Helvetica,Arial,sans-serif" font-size="70" font-weight="bold" fill="#1A2433">era ontem.</text>
<rect x="72" y="482" width="120" height="5" fill="#C9A34C"/>
<text x="72" y="580" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">O segundo melhor é hoje.</text>
<text x="72" y="670" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#3A4553">Cada ano que passa sem um plano é um ano de</text>
<text x="72" y="716" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#3A4553">dinheiro que vai para o aluguel de outra</text>
<text x="72" y="762" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#3A4553">pessoa.</text>
<text x="72" y="838" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#3A4553">Não existe idade errada para começar. Existe</text>
<text x="72" y="884" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#3A4553">começar tarde e pagar mais caro por isso.</text>
<text x="72" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.72">VTR CONSÓRCIOS</text>
<text x="1008" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.72" text-anchor="end">6/7</text>
</svg>