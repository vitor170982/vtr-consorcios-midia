<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="8" fill="#C9A34C"/>
<text x="72" y="150" font-family="Helvetica,Arial,sans-serif" font-size="58" font-weight="bold" fill="#AA5A16">6</text>
<text x="72" y="250" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#1A2433">Você sabe quanto custa</text>
<text x="72" y="330" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#1A2433">de verdade?</text>
<rect x="72" y="430" width="120" height="5" fill="#C9A34C"/>
<text x="72" y="498" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">Não é só o preço do imóvel. Some</text>
<text x="72" y="550" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">escritura, ITBI, registro e corretagem</text>
<text x="72" y="602" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">ao valor da compra.</text>
<text x="72" y="680" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">Quem calcula só o preço da fachada</text>
<text x="72" y="732" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">descobre o resto no cartório, sem ter</text>
<text x="72" y="784" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">reservado.</text>
<text x="72" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75">VTR CONSÓRCIOS</text>
<text x="1008" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75" text-anchor="end">6/9</text>
</svg>