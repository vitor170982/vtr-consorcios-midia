<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="8" fill="#C9A34C"/>
<text x="72" y="130" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#AA5A16" letter-spacing="3">LEIA ANTES DE SE ANIMAR</text>
<text x="72" y="230" font-family="Helvetica,Arial,sans-serif" font-size="66" font-weight="bold" fill="#1A2433">O que a meia</text>
<text x="72" y="308" font-family="Helvetica,Arial,sans-serif" font-size="66" font-weight="bold" fill="#1A2433">parcela significa.</text>
<rect x="72" y="396" width="120" height="5" fill="#C9A34C"/>
<circle cx="88" cy="474" r="7" fill="#C9A34C"/>
<text x="120" y="486" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">A parcela reduzida vale até a</text>
<text x="120" y="532" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">contemplação.</text>
<circle cx="88" cy="594" r="7" fill="#C9A34C"/>
<text x="120" y="606" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">Depois de contemplado, ela volta ao</text>
<text x="120" y="652" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">valor cheio.</text>
<circle cx="88" cy="714" r="7" fill="#C9A34C"/>
<text x="120" y="726" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">O total do contrato não muda — muda</text>
<text x="120" y="772" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">quando você paga.</text>
<circle cx="88" cy="834" r="7" fill="#C9A34C"/>
<text x="120" y="846" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">É fôlego agora, não desconto no fim.</text>
<text x="72" y="930" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#8B93A0">Simulação com prazo de 200 meses e taxa de administração de</text>
<text x="72" y="962" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#8B93A0">20,8% (média de imóveis no Banco Central). Sujeito a grupos</text>
<text x="72" y="994" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#8B93A0">e cotas disponíveis.</text>
<text x="72" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.75">VTR CONSÓRCIOS</text>
<text x="1008" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.75" text-anchor="end">5/6</text>
</svg>