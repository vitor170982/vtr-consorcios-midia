<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C" letter-spacing="4">OFERTA</text>
<text x="80" y="490" font-family="Helvetica,Arial,sans-serif" font-size="78" font-weight="bold" fill="#FFFFFF">Se você já</text>
<text x="80" y="589" font-family="Helvetica,Arial,sans-serif" font-size="78" font-weight="bold" fill="#FFFFFF">pagou aluguel</text>
<text x="80" y="688" font-family="Helvetica,Arial,sans-serif" font-size="78" font-weight="bold" fill="#FFFFFF">este ano,</text>
<text x="80" y="787" font-family="Helvetica,Arial,sans-serif" font-size="78" font-weight="bold" fill="#FFFFFF">você já sabe.</text>
<rect x="80" y="892" width="230" height="9" fill="#C9A34C"/>
<text x="80" y="996" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">R$ 500 por mês num consórcio de R$</text>
<text x="80" y="1052" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">200 mil é menos do que muita gente</text>
<text x="80" y="1108" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">paga de aluguel por aí.</text>
<text x="80" y="1190" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">A diferença é que um vira</text>
<text x="80" y="1246" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">patrimônio e o outro não.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#969690" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>