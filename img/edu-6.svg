<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="9" fill="#C9A34C"/>
<text x="72" y="150" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#C9A34C" letter-spacing="3">HONESTIDADE ANTES DE TUDO</text>
<text x="72" y="280" font-family="Helvetica,Arial,sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF">O consórcio</text>
<text x="72" y="364" font-family="Helvetica,Arial,sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF">não é mágica.</text>
<rect x="72" y="458" width="150" height="6" fill="#C9A34C"/>
<circle cx="88" cy="538" r="7" fill="#C9A34C"/>
<text x="120" y="548" font-family="Helvetica,Arial,sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF">Não é investimento</text>
<text x="120" y="592" font-family="Helvetica,Arial,sans-serif" font-size="28" fill="#D6D2C8">É compra planejada. Não rende como aplicação.</text>
<circle cx="88" cy="642" r="7" fill="#C9A34C"/>
<text x="120" y="652" font-family="Helvetica,Arial,sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF">Não tem data para contemplar</text>
<text x="120" y="696" font-family="Helvetica,Arial,sans-serif" font-size="28" fill="#D6D2C8">É sorteio ou lance. Ninguém pode prometer mês.</text>
<circle cx="88" cy="746" r="7" fill="#C9A34C"/>
<text x="120" y="756" font-family="Helvetica,Arial,sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF">Não é para quem tem pressa</text>
<text x="120" y="800" font-family="Helvetica,Arial,sans-serif" font-size="28" fill="#D6D2C8">Quem precisa do imóvel este mês, financia.</text>
<circle cx="88" cy="850" r="7" fill="#C9A34C"/>
<text x="120" y="860" font-family="Helvetica,Arial,sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF">Não é isento de risco</text>
<text x="120" y="904" font-family="Helvetica,Arial,sans-serif" font-size="28" fill="#D6D2C8">A administradora pode ter problemas — por isso</text>
<text x="120" y="940" font-family="Helvetica,Arial,sans-serif" font-size="28" fill="#D6D2C8">o Banco Central a fiscaliza. Conferir é seu</text>
<text x="120" y="976" font-family="Helvetica,Arial,sans-serif" font-size="28" fill="#D6D2C8">papel também.</text>
<text x="72" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#969690" opacity="0.72">VTR CONSÓRCIOS</text>
<text x="1008" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#969690" opacity="0.72" text-anchor="end">6/7</text>
</svg>