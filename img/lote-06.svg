<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C" letter-spacing="4">SENDO HONESTO</text>
<text x="80" y="440" font-family="Helvetica,Arial,sans-serif" font-size="70" font-weight="bold" fill="#FFFFFF">Não é para</text>
<text x="80" y="524" font-family="Helvetica,Arial,sans-serif" font-size="70" font-weight="bold" fill="#FFFFFF">todo mundo.</text>
<circle cx="96" cy="624" r="8" fill="#C9A34C"/>
<text x="130" y="638" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">Não serve se você precisa do imóvel este</text>
<text x="130" y="684" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">mês — nesse caso, financiamento.</text>
<circle cx="96" cy="750" r="8" fill="#C9A34C"/>
<text x="130" y="764" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">Não serve se está usando o cartão para</text>
<text x="130" y="810" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">pagar as contas. Consórcio é</text>
<text x="130" y="856" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">organização, não socorro.</text>
<circle cx="96" cy="922" r="8" fill="#C9A34C"/>
<text x="130" y="936" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">Não serve se achar que alguém pode prometer</text>
<text x="130" y="982" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">prazo para contemplar — porque ninguém pode.</text>
<text x="80" y="1082" font-family="Helvetica,Arial,sans-serif" font-size="38" font-weight="bold" fill="#C9A34C">Prefiro te dizer isso agora do que te</text>
<text x="80" y="1130" font-family="Helvetica,Arial,sans-serif" font-size="38" font-weight="bold" fill="#C9A34C">vender errado.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#969690" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>