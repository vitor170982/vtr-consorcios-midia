<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="8" fill="#C9A34C"/>
<text x="72" y="150" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#C9A34C" letter-spacing="3">QUANTO CUSTA DE VERDADE</text>
<text x="72" y="300" font-family="Helvetica,Arial,sans-serif" font-size="86" font-weight="bold" fill="#FFFFFF">A parcela de</text>
<text x="72" y="398" font-family="Helvetica,Arial,sans-serif" font-size="86" font-weight="bold" fill="#FFFFFF">cada crédito,</text>
<text x="72" y="496" font-family="Helvetica,Arial,sans-serif" font-size="86" font-weight="bold" fill="#FFFFFF">sem enrolação.</text>
<rect x="72" y="600" width="180" height="6" fill="#C9A34C"/>
<text x="72" y="686" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">Quatro valores de crédito. A parcela</text>
<text x="72" y="738" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">cheia e a parcela com o Plano 50 —</text>
<text x="72" y="790" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">aquela que cabe no bolso até a</text>
<text x="72" y="842" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">contemplação.</text>
<rect x="72" y="1050" width="330" height="70" rx="35" fill="#C9A34C"/>
<text x="108" y="1097" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#0C2C27">Arrasta →</text>
<text x="72" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.75">VTR CONSÓRCIOS</text>
<text x="1008" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.75" text-anchor="end">1/6</text>
</svg>