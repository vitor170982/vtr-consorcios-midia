<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16" letter-spacing="4">O EXEMPLO COMPLETO</text>
<text x="80" y="450" font-family="Helvetica,Arial,sans-serif" font-size="76" font-weight="bold" fill="#1A2433">R$ 300 mil</text>
<text x="80" y="516" font-family="Helvetica,Arial,sans-serif" font-size="40" fill="#6B7482">em 200 meses</text>
<rect x="80" y="560" width="180" height="8" fill="#C9A34C"/>
<rect x="80" y="640" width="920" height="240" rx="16" fill="#0C2C27"/>
<text x="116" y="710" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" fill="#C9A34C">DURANTE, ATÉ CONTEMPLAR</text>
<text x="116" y="816" font-family="Helvetica,Arial,sans-serif" font-size="84" font-weight="bold" fill="#FFFFFF">R$ 875,46</text>
<rect x="80" y="910" width="920" height="240" rx="16" fill="#FFFFFF" stroke="#D9D0BC" stroke-width="3"/>
<text x="116" y="980" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" fill="#6B7482">DEPOIS DE CONTEMPLAR</text>
<text x="116" y="1086" font-family="Helvetica,Arial,sans-serif" font-size="84" font-weight="bold" fill="#1A2433">R$ 1.775,40</text>
<text x="80" y="1220" font-family="Helvetica,Arial,sans-serif" font-size="38" font-weight="bold" fill="#AA5A16">Economia enquanto não contempla:</text>
<text x="80" y="1276" font-family="Helvetica,Arial,sans-serif" font-size="44" font-weight="bold" fill="#AA5A16">R$ 900,00 por mês</text>
<text x="80" y="1366" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#3A4553">Os 60% valem só até a contemplação. O total do</text>
<text x="80" y="1408" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#3A4553">contrato não muda — muda quando você paga.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>