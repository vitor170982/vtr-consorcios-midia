<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="9" fill="#C9A34C"/>
<text x="72" y="160" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#C9A34C" letter-spacing="3">JUROS X TAXA</text>
<text x="72" y="330" font-family="Helvetica,Arial,sans-serif" font-size="92" font-weight="bold" fill="#FFFFFF">Você não paga</text>
<text x="72" y="436" font-family="Helvetica,Arial,sans-serif" font-size="92" font-weight="bold" fill="#FFFFFF">juros no</text>
<text x="72" y="542" font-family="Helvetica,Arial,sans-serif" font-size="92" font-weight="bold" fill="#FFFFFF">consórcio.</text>
<text x="72" y="648" font-family="Helvetica,Arial,sans-serif" font-size="92" font-weight="bold" fill="#C9A34C">Mas paga algo.</text>
<rect x="72" y="762" width="200" height="7" fill="#C9A34C"/>
<text x="72" y="854" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">E a diferença entre os dois é o</text>
<text x="72" y="906" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">que separa quem compra imóvel de</text>
<text x="72" y="958" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">quem paga por ele duas vezes.</text>
<rect x="72" y="1085" width="330" height="70" rx="35" fill="#C9A34C"/>
<text x="108" y="1132" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#0C2C27">Arrasta →</text>
<text x="72" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.72">VTR CONSÓRCIOS</text>
<text x="1008" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.72" text-anchor="end">1/7</text>
</svg>