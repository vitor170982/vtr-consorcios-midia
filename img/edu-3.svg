<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="9" fill="#C9A34C"/>
<text x="72" y="130" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#AA5A16" letter-spacing="3">O QUE É TAXA DE ADMINISTRAÇÃO</text>
<text x="72" y="230" font-family="Helvetica,Arial,sans-serif" font-size="70" font-weight="bold" fill="#1A2433">O preço do</text>
<text x="72" y="312" font-family="Helvetica,Arial,sans-serif" font-size="70" font-weight="bold" fill="#1A2433">serviço.</text>
<rect x="72" y="404" width="120" height="5" fill="#C9A34C"/>
<text x="72" y="504" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">A administradora monta o grupo, faz a</text>
<text x="72" y="552" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">assembleia, controla as parcelas, presta</text>
<text x="72" y="600" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">contas e responde pela fiscalização do Banco</text>
<text x="72" y="648" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">Central.</text>
<text x="72" y="724" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">Isso é trabalho — e trabalho tem preço.</text>
<text x="72" y="800" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">A taxa é definida em contrato, diluída nas</text>
<text x="72" y="848" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">parcelas e NÃO cresce sobre si mesma.</text>
<rect x="72" y="908" width="6" height="6" fill="#C9A34C"/>
<text x="94" y="938" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#AA5A16">Você sabe o custo total desde o primeiro</text>
<text x="94" y="982" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#AA5A16">dia. Isso é a diferença.</text>
<text x="72" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.72">VTR CONSÓRCIOS</text>
<text x="1008" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.72" text-anchor="end">3/7</text>
</svg>