<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C" letter-spacing="4">SEM MÁGICA</text>
<text x="80" y="490" font-family="Helvetica,Arial,sans-serif" font-size="86" font-weight="bold" fill="#FFFFFF">Ninguém</text>
<text x="80" y="600" font-family="Helvetica,Arial,sans-serif" font-size="86" font-weight="bold" fill="#FFFFFF">te entrega</text>
<text x="80" y="710" font-family="Helvetica,Arial,sans-serif" font-size="86" font-weight="bold" fill="#FFFFFF">casa de graça.</text>
<rect x="80" y="826" width="230" height="9" fill="#C9A34C"/>
<text x="80" y="930" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">Você paga por 200 meses e recebe</text>
<text x="80" y="986" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">quando for contemplado.</text>
<text x="80" y="1068" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">A vantagem real é não pagar juros</text>
<text x="80" y="1124" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">— não é ter o bem sem pagar.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#969690" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>