<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="9" fill="#C9A34C"/>
<text x="72" y="130" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#AA5A16" letter-spacing="3">O QUE É JUROS</text>
<text x="72" y="230" font-family="Helvetica,Arial,sans-serif" font-size="70" font-weight="bold" fill="#1A2433">O aluguel do</text>
<text x="72" y="312" font-family="Helvetica,Arial,sans-serif" font-size="70" font-weight="bold" fill="#1A2433">dinheiro.</text>
<rect x="72" y="404" width="120" height="5" fill="#C9A34C"/>
<text x="72" y="504" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">Quando o banco te empresta dinheiro, ele</text>
<text x="72" y="552" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">cobra por isso. Todo mês.</text>
<text x="72" y="628" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">E o detalhe que muda tudo: juros incidem</text>
<text x="72" y="676" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">sobre o saldo devedor. Ou seja — crescem</text>
<text x="72" y="724" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">sobre si mesmos.</text>
<text x="72" y="800" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">No começo do financiamento, quase tudo que</text>
<text x="72" y="848" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">você paga é juros, não é o imóvel.</text>
<rect x="72" y="908" width="6" height="6" fill="#C9A34C"/>
<text x="94" y="938" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#AA5A16">É por isso que um financiamento de 30 anos</text>
<text x="94" y="982" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#AA5A16">pode custar o dobro do imóvel.</text>
<text x="72" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.72">VTR CONSÓRCIOS</text>
<text x="1008" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.72" text-anchor="end">2/7</text>
</svg>