<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C" letter-spacing="4">O MENOR DA TABELA</text>
<text x="80" y="440" font-family="Helvetica,Arial,sans-serif" font-size="44" fill="#D6D2C8">Dá para começar com</text>
<text x="70" y="666" font-family="Helvetica,Arial,sans-serif" font-size="190" font-weight="bold" fill="#FFFFFF">R$ 583,64</text>
<text x="80" y="726" font-family="Helvetica,Arial,sans-serif" font-size="46" font-weight="bold" fill="#C9A34C">por mês</text>
<text x="80" y="816" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">Crédito de R$ 200 mil, sem juros e</text>
<text x="80" y="866" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">sem financiamento.</text>
<text x="80" y="940" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">A parcela cheia seria R$ 1.183,60.</text>
<text x="80" y="990" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">Com o Black, fica nesse valor até a</text>
<text x="80" y="1040" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">contemplação.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#969690" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>
