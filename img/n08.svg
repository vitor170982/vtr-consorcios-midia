<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C" letter-spacing="4">GENTE COMO VOCÊ</text>
<text x="80" y="490" font-family="Helvetica,Arial,sans-serif" font-size="82" font-weight="bold" fill="#FFFFFF">Quem mora fora</text>
<text x="80" y="594" font-family="Helvetica,Arial,sans-serif" font-size="82" font-weight="bold" fill="#FFFFFF">há anos e pensa</text>
<text x="80" y="698" font-family="Helvetica,Arial,sans-serif" font-size="82" font-weight="bold" fill="#FFFFFF">em voltar.</text>
<rect x="80" y="808" width="230" height="9" fill="#C9A34C"/>
<text x="80" y="912" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">Vai precisar de casa aqui. Vai</text>
<text x="80" y="968" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">precisar de lugar para investir o que</text>
<text x="80" y="1024" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">guardou.</text>
<text x="80" y="1106" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">Começar agora é mais barato que</text>
<text x="80" y="1162" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#D6D2C8">começar no ano da mudança.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#969690" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>