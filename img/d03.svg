<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C" letter-spacing="4">FAÇA ESSA CONTA</text>
<text x="80" y="440" font-family="Helvetica,Arial,sans-serif" font-size="48" fill="#FFFFFF">R$ 1.500 de aluguel</text>
<text x="80" y="500" font-family="Helvetica,Arial,sans-serif" font-size="48" fill="#FFFFFF">por mês.</text>
<text x="80" y="620" font-family="Helvetica,Arial,sans-serif" font-size="40" fill="#D6D2C8">Em um ano, são R$ 18.000.</text>
<text x="80" y="680" font-family="Helvetica,Arial,sans-serif" font-size="40" fill="#D6D2C8">Em cinco anos, R$ 90.000.</text>
<text x="80" y="820" font-family="Helvetica,Arial,sans-serif" font-size="44" font-weight="bold" fill="#C9A34C">Quanto disso virou seu?</text>
<text x="80" y="920" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">O aluguel paga a casa de alguém.</text>
<text x="80" y="970" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">A parcela paga a sua.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#969690" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>
