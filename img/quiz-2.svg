<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<rect x="80" y="300" width="300" height="66" rx="33" fill="#0C2C27"/>
<text x="230" y="345" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" fill="#C9A34C" text-anchor="middle" letter-spacing="2">A RESPOSTA</text>
<text x="80" y="470" font-family="Helvetica,Arial,sans-serif" font-size="128" font-weight="bold" fill="#AA5A16">A) Sim.</text>
<text x="80" y="640" font-family="Helvetica,Arial,sans-serif" font-size="44" fill="#3A4553">E não é opinião minha — é a</text>
<text x="80" y="698" font-family="Helvetica,Arial,sans-serif" font-size="44" fill="#3A4553">conta:</text>
<rect x="80" y="806" width="920" height="290" rx="16" fill="#0C2C27"/>
<text x="120" y="872" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#C9A34C" letter-spacing="2">BLACK NOVEMBRO</text>
<text x="120" y="956" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#FFFFFF">R$ 300 mil de crédito</text>
<text x="120" y="1021" font-family="Helvetica,Arial,sans-serif" font-size="64" font-weight="bold" fill="#FFFFFF">R$ 875,46 /mês</text>
<text x="120" y="1066" font-family="Helvetica,Arial,sans-serif" font-size="28" fill="#D6D2C8">até a contemplação</text>
<text x="80" y="1146" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">Casa, apartamento, terreno ou</text>
<text x="80" y="1194" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">construção. Você escolhe o imóvel</text>
<text x="80" y="1242" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">quando for contemplado.</text>
<text x="80" y="1320" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" fill="#AA5A16">Mas tem um detalhe: depois de contemplado,</text>
<text x="80" y="1360" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" fill="#AA5A16">a parcela volta ao valor cheio. Eu explico</text>
<text x="80" y="1400" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" fill="#AA5A16">isso antes de qualquer proposta.</text>
<text x="80" y="1580" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#696960" opacity="0.8">VTR CONSÓRCIOS</text>
</svg>