<text x="112" y="706" font-family="Helvetica,Arial,sans-serif" font-size="40" fill="#FFFFFF">R$ 300 mil de crédito</text>
<text x="112" y="772" font-family="Helvetica,Arial,sans-serif" font-size="58" font-weight="bold" fill="#FFFFFF">R$ 875,46 /mês</text>
<text x="112" y="814" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#D6D2C8">até a contemplação</text>
<text x="72" y="882" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#3A4553">Casa, apartamento, terreno ou construção.</text>
<text x="72" y="924" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#3A4553">Você escolhe o imóvel quando for</text>
