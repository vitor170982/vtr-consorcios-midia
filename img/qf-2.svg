<text x="217" y="172" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#C9A34C" text-anchor="middle" letter-spacing="2">A RESPOSTA</text>
<text x="72" y="320" font-family="Helvetica,Arial,sans-serif" font-size="110" font-weight="bold" fill="#AA5A16">A) Sim.</text>
<text x="72" y="430" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">E não é opinião minha — é a</text>
<text x="72" y="484" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">conta:</text>
<rect x="72" y="572" width="936" height="260" rx="14" fill="#0C2C27"/>
