<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="8" fill="#C9A34C"/>
<text x="72" y="150" font-family="Helvetica,Arial,sans-serif" font-size="58" font-weight="bold" fill="#AA5A16">2</text>
<text x="72" y="250" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#1A2433">Seu CPF está ativo?</text>
<rect x="72" y="350" width="120" height="5" fill="#C9A34C"/>
<text x="72" y="418" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">Parece óbvio, mas é o primeiro</text>
<text x="72" y="470" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">travamento. Quem mora fora há anos deixa</text>
<text x="72" y="522" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">o CPF parado, sem declarar, sem</text>
<text x="72" y="574" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">movimento.</text>
<text x="72" y="652" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">Sem CPF regular você não abre conta, não</text>
<text x="72" y="704" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">assina contrato e não compra nada no seu</text>
<text x="72" y="756" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">nome no Brasil.</text>
<rect x="72" y="822" width="6" height="6" fill="#C9A34C"/>
<text x="94" y="848" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16">Resolva isso antes de escolher o imóvel.</text>
<text x="72" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75">VTR CONSÓRCIOS</text>
<text x="1008" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75" text-anchor="end">2/9</text>
</svg>