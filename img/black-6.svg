<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="12" fill="#B3202A"/>
<rect x="0" y="12" width="1080" height="5" fill="#C9A34C"/>
<path d="M 175 306 L 199 348 L 151 348 Z" fill="none" stroke="#C9A34C" stroke-width="5" stroke-linejoin="round"/>
<line x1="175" y1="318" x2="175" y2="333" stroke="#C9A34C" stroke-width="5" stroke-linecap="round"/>
<circle cx="175" cy="341" r="2.6" fill="#C9A34C"/>
<text x="230" y="348" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#C9A34C">COTAS LIMITADAS</text>
<text x="72" y="480" font-family="Helvetica,Arial,sans-serif" font-size="84" font-weight="bold" fill="#FFFFFF">A ação vai até</text>
<text x="72" y="578" font-family="Helvetica,Arial,sans-serif" font-size="84" font-weight="bold" fill="#FFFFFF">acabar o estoque</text>
<text x="72" y="676" font-family="Helvetica,Arial,sans-serif" font-size="84" font-weight="bold" fill="#FFFFFF">de cotas.</text>
<rect x="72" y="780" width="180" height="7" fill="#C9A34C"/>
<text x="72" y="870" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#D6D2C8">Não tem data fixa de encerramento —</text>
<text x="72" y="918" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#D6D2C8">encerra quando as cotas dos grupos</text>
<text x="72" y="966" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#D6D2C8">participantes acabarem. Quem entra</text>
<text x="72" y="1014" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#D6D2C8">depois, entra nas condições normais.</text>
<text x="72" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#969690" opacity="0.72">VTR CONSÓRCIOS</text>
<text x="1008" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#969690" opacity="0.72" text-anchor="end">6/7</text>
</svg>