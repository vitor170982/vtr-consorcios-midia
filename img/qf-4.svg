<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="12" fill="#C9A34C"/>
<text x="72" y="140" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#C9A34C" letter-spacing="3">SENDO HONESTO</text>
<text x="72" y="250" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#FFFFFF">Serve para você?</text>
<text x="72" y="334" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#FFFFFF">Depende.</text>
<rect x="72" y="428" width="130" height="6" fill="#C9A34C"/>
<text x="72" y="518" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#C9A34C" letter-spacing="2">FAZ SENTIDO SE</text>
<text x="94" y="570" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#D6D2C8">— você tem uma parcela que cabe no mês</text>
<text x="94" y="614" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#D6D2C8">— e quer comprar no Brasil sem financiamento</text>
<text x="72" y="698" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#F09B7A" letter-spacing="2">NÃO FAZ SENTIDO SE</text>
<text x="94" y="750" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#D6D2C8">— você precisa do imóvel este mês</text>
<text x="94" y="794" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#D6D2C8">— ou está usando o cartão para pagar as contas</text>
<text x="72" y="888" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C">Eu prefiro te dizer isso agora do que te</text>
<text x="72" y="932" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C">vender errado.</text>
<text x="72" y="1278" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#969690" opacity="0.7">VTR CONSÓRCIOS</text>
<text x="1008" y="1278" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#969690" opacity="0.7" text-anchor="end">4/6</text>
</svg>