<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="9" fill="#C9A34C"/>
<text x="72" y="130" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#AA5A16" letter-spacing="3">POR QUE TANTA DIFERENÇA</text>
<text x="72" y="230" font-family="Helvetica,Arial,sans-serif" font-size="70" font-weight="bold" fill="#1A2433">Um cresce</text>
<text x="72" y="312" font-family="Helvetica,Arial,sans-serif" font-size="70" font-weight="bold" fill="#1A2433">sobre você.</text>
<text x="72" y="394" font-family="Helvetica,Arial,sans-serif" font-size="70" font-weight="bold" fill="#1A2433">O outro não.</text>
<rect x="72" y="486" width="120" height="5" fill="#C9A34C"/>
<text x="72" y="586" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">Juros compostos são uma bola de neve: cada</text>
<text x="72" y="634" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">mês o banco cobra juros sobre juros já</text>
<text x="72" y="682" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">cobrados.</text>
<text x="72" y="758" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">A taxa de administração é uma porcentagem</text>
<text x="72" y="806" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">fixa, definida no contrato, dividida no</text>
<text x="72" y="854" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">prazo. Não tem bola de neve.</text>
<text x="72" y="930" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">É por isso que, em 200 meses, o</text>
<text x="72" y="978" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">financiamento custou 5 vezes mais em</text>
<text x="72" y="1026" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">encargos do que o consórcio.</text>
<text x="72" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.72">VTR CONSÓRCIOS</text>
<text x="1008" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.72" text-anchor="end">5/7</text>
</svg>