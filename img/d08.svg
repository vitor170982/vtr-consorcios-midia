<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16" letter-spacing="4">COMECE PELO CPF</text>
<text x="80" y="450" font-family="Helvetica,Arial,sans-serif" font-size="50" fill="#0C2C27">Brasileiro que mora fora</text>
<text x="80" y="515" font-family="Helvetica,Arial,sans-serif" font-size="50" fill="#0C2C27">pode fazer consórcio.</text>
<text x="80" y="630" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A3A34">O primeiro passo é ter o CPF em dia</text>
<text x="80" y="680" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A3A34">e o cadastro aprovado.</text>
<text x="80" y="790" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A3A34">A partir daí, a parcela pode ser paga</text>
<text x="80" y="840" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A3A34">no cartão ou com conta lá fora.</text>
<text x="80" y="950" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#AA5A16">Documento, não obstáculo.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>
