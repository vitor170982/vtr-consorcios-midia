<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="9" fill="#C9A34C"/>
<text x="72" y="150" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#C9A34C" letter-spacing="3">O PROBLEMA NÃO É O SALÁRIO</text>
<text x="72" y="300" font-family="Helvetica,Arial,sans-serif" font-size="82" font-weight="bold" fill="#FFFFFF">É o que sobra</text>
<text x="72" y="396" font-family="Helvetica,Arial,sans-serif" font-size="82" font-weight="bold" fill="#FFFFFF">no fim do mês</text>
<text x="72" y="492" font-family="Helvetica,Arial,sans-serif" font-size="82" font-weight="bold" fill="#FFFFFF">sem destino.</text>
<rect x="72" y="592" width="180" height="7" fill="#C9A34C"/>
<text x="72" y="688" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">Dólar parado na conta corrente não rende</text>
<text x="72" y="740" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">e não vira nada.</text>
<text x="72" y="822" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">E mandar para o Brasil sem plano vira</text>
<text x="72" y="874" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">gasto — não vira patrimônio.</text>
<text x="72" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#969690" opacity="0.72">VTR CONSÓRCIOS</text>
<text x="1008" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#969690" opacity="0.72" text-anchor="end">3/7</text>
</svg>