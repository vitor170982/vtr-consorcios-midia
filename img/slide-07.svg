<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="8" fill="#C9A34C"/>
<text x="72" y="150" font-family="Helvetica,Arial,sans-serif" font-size="58" font-weight="bold" fill="#AA5A16">7</text>
<text x="72" y="250" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#1A2433">Como fica a</text>
<text x="72" y="330" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#1A2433">declaração?</text>
<rect x="72" y="430" width="120" height="5" fill="#C9A34C"/>
<text x="72" y="498" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">Imóvel no Brasil de quem mora nos EUA</text>
<text x="72" y="550" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">tem regra nos dois países. Isso não se</text>
<text x="72" y="602" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">resolve com opinião de amigo.</text>
<text x="72" y="680" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">Precisa de contador que entenda as duas</text>
<text x="72" y="732" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">pontas. Antes da compra, não depois.</text>
<text x="72" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75">VTR CONSÓRCIOS</text>
<text x="1008" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75" text-anchor="end">7/9</text>
</svg>