<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="8" fill="#C9A34C"/>
<text x="72" y="132" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#AA5A16" letter-spacing="3">POR QUE A TAXA VARIA</text>
<text x="72" y="220" font-family="Helvetica,Arial,sans-serif" font-size="62" font-weight="bold" fill="#1A2433">O mesmo consórcio tem</text>
<text x="72" y="292" font-family="Helvetica,Arial,sans-serif" font-size="62" font-weight="bold" fill="#1A2433">taxas diferentes.</text>
<rect x="72" y="380" width="120" height="5" fill="#C9A34C"/>
<text x="72" y="446" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">A taxa depende de três coisas: a</text>
<text x="72" y="496" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">administradora, o prazo do grupo e o tipo</text>
<text x="72" y="546" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">de bem.</text>
<text x="72" y="620" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">Prazo maior costuma significar taxa maior</text>
<text x="72" y="670" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">no total, porque o serviço é prestado por</text>
<text x="72" y="720" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">mais tempo.</text>
<text x="72" y="794" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">Por isso comparar dois consórcios só pelo</text>
<text x="72" y="844" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">valor da parcela é erro. Compare pelo</text>
<text x="72" y="894" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">custo total.</text>
<rect x="72" y="952" width="6" height="6" fill="#C9A34C"/>
<text x="94" y="976" font-family="Helvetica,Arial,sans-serif" font-size="33" font-weight="bold" fill="#AA5A16">Peça o custo total do consórcio, não só a</text>
<text x="94" y="1020" font-family="Helvetica,Arial,sans-serif" font-size="33" font-weight="bold" fill="#AA5A16">parcela.</text>
<text x="72" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75">VTR CONSÓRCIOS</text>
<text x="1008" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75" text-anchor="end">5/8</text>
</svg>