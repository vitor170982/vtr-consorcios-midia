<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16" letter-spacing="4">O QUE É FUNDO DE RESERVA</text>
<text x="80" y="440" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#1A2433">Uma reserva</text>
<text x="80" y="522" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#1A2433">do grupo.</text>
<circle cx="96" cy="620" r="8" fill="#C9A34C"/>
<text x="130" y="634" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">É uma pequena taxa que forma um caixa</text>
<text x="130" y="680" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">para cobrir inadimplência do próprio grupo.</text>
<circle cx="96" cy="746" r="8" fill="#C9A34C"/>
<text x="130" y="760" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">Sem ela, quem atrasa prejudica a todos.</text>
<circle cx="96" cy="826" r="8" fill="#C9A34C"/>
<text x="130" y="840" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">Não é lucro da administradora — é</text>
<text x="130" y="886" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">proteção do grupo.</text>
<text x="80" y="986" font-family="Helvetica,Arial,sans-serif" font-size="38" font-weight="bold" fill="#AA5A16">Está no contrato. Confira o percentual.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>