<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16" letter-spacing="4">A VIRADA</text>
<text x="80" y="450" font-family="Helvetica,Arial,sans-serif" font-size="52" fill="#0C2C27">Dez anos passam de</text>
<text x="80" y="520" font-family="Helvetica,Arial,sans-serif" font-size="52" fill="#0C2C27">qualquer jeito.</text>
<text x="80" y="640" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A3A34">A diferença é o que vai estar no</text>
<text x="80" y="690" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A3A34">extrato daqui a dez anos.</text>
<text x="80" y="800" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A3A34">Uma parcela de R$ 875,46 por mês</text>
<text x="80" y="850" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A3A34">constrói um crédito de R$ 300 mil.</text>
<text x="80" y="960" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#AA5A16">Você não precisa de mais salário.</text>
<text x="80" y="1010" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#AA5A16">Precisa de um destino para ele.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>
