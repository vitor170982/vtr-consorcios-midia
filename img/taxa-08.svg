<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="8" fill="#C9A34C"/>
<text x="72" y="150" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" fill="#C9A34C" letter-spacing="3">VTR CONSÓRCIOS</text>
<text x="72" y="320" font-family="Helvetica,Arial,sans-serif" font-size="94" font-weight="bold" fill="#FFFFFF">Salva antes</text>
<text x="72" y="426" font-family="Helvetica,Arial,sans-serif" font-size="94" font-weight="bold" fill="#FFFFFF">de assinar.</text>
<rect x="72" y="538" width="164" height="6" fill="#C9A34C"/>
<text x="72" y="612" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">Quem entende a taxa de administração</text>
<text x="72" y="664" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">negocia melhor. Quem não entende</text>
<text x="72" y="716" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">assina o que aparecer.</text>
<text x="72" y="812" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C">Me segue: eu explico consórcio sem</text>
<text x="72" y="858" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C">promessa fácil, morando nos EUA e</text>
<text x="72" y="904" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C">comprando no Brasil.</text>
<rect x="72" y="1080" width="380" height="70" rx="35" fill="#C9A34C"/>
<text x="104" y="1127" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#0C2C27">@consorciovtr</text>
<text x="72" y="1200" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#8C9187">Ademicon · autorizada pelo Banco Central do Brasil</text>
<text x="72" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#969690" opacity="0.75">VTR CONSÓRCIOS</text>
<text x="1008" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#969690" opacity="0.75" text-anchor="end">8/8</text>
