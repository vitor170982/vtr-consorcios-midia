<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C" letter-spacing="4">CONTEMPLAÇÃO</text>
<text x="80" y="450" font-family="Helvetica,Arial,sans-serif" font-size="46" fill="#FFFFFF">Contemplar não é sorteio</text>
<text x="80" y="515" font-family="Helvetica,Arial,sans-serif" font-size="46" fill="#FFFFFF">e não é leilão.</text>
<text x="80" y="630" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">A assembleia libera uma parte das</text>
<text x="80" y="680" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">cotas do grupo por mês.</text>
<text x="80" y="790" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">Ninguém pode prometer mês.</text>
<text x="80" y="840" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">O que existe é histórico — e ele</text>
<text x="80" y="890" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">varia de grupo para grupo.</text>
<text x="80" y="1000" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#C9A34C">Quem promete prazo está te</text>
<text x="80" y="1045" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#C9A34C">vendendo o que não controla.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#969690" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>
