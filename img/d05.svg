<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C" letter-spacing="4">PERGUNTE ESTAS 5</text>
<text x="80" y="430" font-family="Helvetica,Arial,sans-serif" font-size="44" fill="#FFFFFF">Antes de assinar qualquer coisa:</text>
<text x="80" y="540" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">1. Qual é a taxa de administração?</text>
<text x="80" y="620" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">2. A parcela muda depois da</text>
<text x="80" y="665" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">contemplação?</text>
<text x="80" y="745" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">3. Qual o prazo do grupo?</text>
<text x="80" y="825" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">4. Existe fundo de reserva?</text>
<text x="80" y="905" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">5. Quem administra e sob qual</text>
<text x="80" y="950" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">autorização?</text>
<text x="80" y="1060" font-family="Helvetica,Arial,sans-serif" font-size="36" font-weight="bold" fill="#C9A34C">Se não souberem responder,</text>
<text x="80" y="1105" font-family="Helvetica,Arial,sans-serif" font-size="36" font-weight="bold" fill="#C9A34C">não assine.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#969690" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>
