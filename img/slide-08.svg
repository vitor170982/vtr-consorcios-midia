<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="8" fill="#C9A34C"/>
<text x="72" y="150" font-family="Helvetica,Arial,sans-serif" font-size="58" font-weight="bold" fill="#AA5A16">8</text>
<text x="72" y="250" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#1A2433">Você tem prazo ou tem</text>
<text x="72" y="330" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#1A2433">pressa?</text>
<rect x="72" y="430" width="120" height="5" fill="#C9A34C"/>
<text x="72" y="498" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">Prazo é planejamento. Pressa é pagar o</text>
<text x="72" y="550" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">preço de não ter planejado antes.</text>
<text x="72" y="628" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">Quem decide com prazo escolhe melhor.</text>
<text x="72" y="680" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">Quem decide com pressa aceita o que</text>
<text x="72" y="732" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">aparecer.</text>
<text x="72" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75">VTR CONSÓRCIOS</text>
<text x="1008" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75" text-anchor="end">8/9</text>
</svg>