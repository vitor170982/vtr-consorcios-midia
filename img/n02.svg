<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16" letter-spacing="4">O QUE NINGUÉM FALA</text>
<text x="80" y="490" font-family="Helvetica,Arial,sans-serif" font-size="80" font-weight="bold" fill="#1A2433">Trabalhar fora</text>
<text x="80" y="592" font-family="Helvetica,Arial,sans-serif" font-size="80" font-weight="bold" fill="#1A2433">não é só</text>
<text x="80" y="694" font-family="Helvetica,Arial,sans-serif" font-size="80" font-weight="bold" fill="#1A2433">ganhar em dólar.</text>
<rect x="80" y="802" width="230" height="9" fill="#C9A34C"/>
<text x="80" y="906" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">É ver o dinheiro ir embora todo</text>
<text x="80" y="962" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">mês em aluguel, carro e conta — e</text>
<text x="80" y="1018" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">nada ficar.</text>
<text x="80" y="1100" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">Não é falta de salário. É falta de</text>
<text x="80" y="1156" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">destino para ele.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>