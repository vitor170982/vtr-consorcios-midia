<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C" letter-spacing="4">DIFERENÇA DE ENCARGO</text>
<text x="80" y="440" font-family="Helvetica,Arial,sans-serif" font-size="44" fill="#D6D2C8">No mesmo imóvel</text>
<text x="70" y="656" font-family="Helvetica,Arial,sans-serif" font-size="180" font-weight="bold" fill="#FFFFFF">5x</text>
<text x="80" y="716" font-family="Helvetica,Arial,sans-serif" font-size="46" font-weight="bold" fill="#C9A34C">mais em juros que em taxa</text>
<text x="80" y="806" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">Financiamento a 10,5% ao ano cobra</text>
<text x="80" y="856" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">juros sobre juros.</text>
<text x="80" y="930" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">Taxa de administração é fixa. Em 200</text>
<text x="80" y="980" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">meses, a diferença é de outra ordem.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#969690" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>