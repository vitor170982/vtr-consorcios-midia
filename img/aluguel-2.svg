<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16" letter-spacing="4">A CONTA É SIMPLES</text>
<text x="80" y="470" font-family="Helvetica,Arial,sans-serif" font-size="48" fill="#3A4553">R$ 1.500 por mês</text>
<text x="80" y="580" font-family="Helvetica,Arial,sans-serif" font-size="80" font-weight="bold" fill="#1A2433">× 12 meses</text>
<rect x="80" y="640" width="200" height="8" fill="#C9A34C"/>
<text x="70" y="840" font-family="Helvetica,Arial,sans-serif" font-size="140" font-weight="bold" fill="#AA5A16">R$ 18.000</text>
<text x="80" y="910" font-family="Helvetica,Arial,sans-serif" font-size="48" font-weight="bold" fill="#1A2433">por ano.</text>
<text x="80" y="1030" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">Em cinco anos morando fora, isso é</text>
<text x="80" y="1086" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">R$ 90 mil que não viraram nada.</text>
<text x="80" y="1182" font-family="Helvetica,Arial,sans-serif" font-size="36" font-weight="bold" fill="#AA5A16">Não é crítica. Aluguel é necessidade.</text>
<text x="80" y="1230" font-family="Helvetica,Arial,sans-serif" font-size="36" font-weight="bold" fill="#AA5A16">Mas é dinheiro que vai e não volta.</text>
<text x="80" y="1590" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>