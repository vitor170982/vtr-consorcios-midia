<text x="72" y="790" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">E o número 3 é onde</text>
<text x="72" y="842" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">quase todo mundo trava.</text>
