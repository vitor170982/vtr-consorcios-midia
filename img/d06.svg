<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16" letter-spacing="4">NÃO É PARA TODO MUNDO</text>
<text x="80" y="450" font-family="Helvetica,Arial,sans-serif" font-size="52" fill="#0C2C27">Eu prefiro te dizer</text>
<text x="80" y="520" font-family="Helvetica,Arial,sans-serif" font-size="52" fill="#0C2C27">quando não serve.</text>
<text x="80" y="640" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A3A34">Se você precisa do imóvel em três</text>
<text x="80" y="690" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A3A34">meses, consórcio é a escolha errada.</text>
<text x="80" y="800" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A3A34">Se é comprar em dois ou três anos,</text>
<text x="80" y="850" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A3A34">sem juros, faz sentido.</text>
<text x="80" y="960" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#AA5A16">O trabalho é dizer se serve —</text>
<text x="80" y="1010" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#AA5A16">não vender por vender.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>
