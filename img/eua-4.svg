<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="9" fill="#C9A34C"/>
<text x="72" y="130" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#AA5A16" letter-spacing="3">O QUE MUDA ISSO</text>
<text x="72" y="230" font-family="Helvetica,Arial,sans-serif" font-size="66" font-weight="bold" fill="#1A2433">Um valor fixo,</text>
<text x="72" y="308" font-family="Helvetica,Arial,sans-serif" font-size="66" font-weight="bold" fill="#1A2433">todo mês, com</text>
<text x="72" y="386" font-family="Helvetica,Arial,sans-serif" font-size="66" font-weight="bold" fill="#1A2433">um destino.</text>
<rect x="72" y="474" width="120" height="5" fill="#C9A34C"/>
<text x="72" y="574" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">É isso que o consórcio faz: pega o que você já paga todo mês</text>
<text x="72" y="622" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A4553">e transforma em carta de crédito para comprar no Brasil.</text>
<rect x="72" y="704" width="6" height="6" fill="#C9A34C"/>
<text x="94" y="714" font-family="Helvetica,Arial,sans-serif" font-size="38" font-weight="bold" fill="#1A2433">Sem juros</text>
<text x="94" y="748" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#3A4553">Você paga taxa de administração, não juros de</text>
<text x="94" y="786" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#3A4553">banco.</text>
<rect x="72" y="850" width="6" height="6" fill="#C9A34C"/>
<text x="94" y="860" font-family="Helvetica,Arial,sans-serif" font-size="38" font-weight="bold" fill="#1A2433">Sem financiamento</text>
<text x="94" y="894" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#3A4553">Você não entra em dívida de banco nem paga</text>
<text x="94" y="932" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#3A4553">juros.</text>
<rect x="72" y="996" width="6" height="6" fill="#C9A34C"/>
<text x="94" y="1006" font-family="Helvetica,Arial,sans-serif" font-size="38" font-weight="bold" fill="#1A2433">Sem sair daqui</text>
<text x="94" y="1040" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#3A4553">Contrata, paga e acompanha morando nos EUA.</text>
<text x="72" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.72">VTR CONSÓRCIOS</text>
<text x="1008" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#696960" opacity="0.72" text-anchor="end">4/7</text>
</svg>
