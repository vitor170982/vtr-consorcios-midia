<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16" letter-spacing="4">QUANTAS PESSOAS</text>
<text x="80" y="440" font-family="Helvetica,Arial,sans-serif" font-size="44" fill="#3A4553">O setor tem hoje</text>
<text x="70" y="656" font-family="Helvetica,Arial,sans-serif" font-size="180" font-weight="bold" fill="#1A2433">13,5</text>
<text x="80" y="716" font-family="Helvetica,Arial,sans-serif" font-size="46" font-weight="bold" fill="#AA5A16">milhões de participantes ativos</text>
<text x="80" y="806" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">Crescimento de 12,1% em um ano.</text>
<text x="80" y="880" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">Não é produto de nicho. É um dos</text>
<text x="80" y="930" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">instrumentos de crédito que mais</text>
<text x="80" y="980" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">cresce no Brasil.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>