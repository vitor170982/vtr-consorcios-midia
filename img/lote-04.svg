<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16" letter-spacing="4">A DIFERENÇA QUE NINGUÉM EXPLICA</text>
<text x="80" y="440" font-family="Helvetica,Arial,sans-serif" font-size="70" font-weight="bold" fill="#1A2433">Juros x taxa.</text>
<circle cx="96" cy="540" r="8" fill="#C9A34C"/>
<text x="130" y="554" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">Juros é o preço do dinheiro emprestado.</text>
<text x="130" y="600" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">Incide sobre o saldo devedor e cresce</text>
<text x="130" y="646" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">sobre si mesmo.</text>
<circle cx="96" cy="712" r="8" fill="#C9A34C"/>
<text x="130" y="726" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">Taxa de administração é o preço do</text>
<text x="130" y="772" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">serviço. Fixa em contrato, diluída no</text>
<text x="130" y="818" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">prazo, não acumula.</text>
<circle cx="96" cy="884" r="8" fill="#C9A34C"/>
<text x="130" y="898" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">Por isso um financiamento pode custar o</text>
<text x="130" y="944" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#3A4553">dobro do imóvel.</text>
<text x="80" y="1044" font-family="Helvetica,Arial,sans-serif" font-size="38" font-weight="bold" fill="#AA5A16">Consórcio não tem juros. Tem taxa — e</text>
<text x="80" y="1092" font-family="Helvetica,Arial,sans-serif" font-size="38" font-weight="bold" fill="#AA5A16">ela é sabida antes de assinar.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>