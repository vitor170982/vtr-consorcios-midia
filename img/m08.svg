<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16" letter-spacing="4">A PARTE CHATA</text>
<text x="80" y="490" font-family="Helvetica,Arial,sans-serif" font-size="96" font-weight="bold" fill="#1A2433">Existe</text>
<text x="80" y="616" font-family="Helvetica,Arial,sans-serif" font-size="96" font-weight="bold" fill="#1A2433">taxa.</text>
<rect x="80" y="744" width="230" height="9" fill="#C9A34C"/>
<text x="80" y="848" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">Quem diz que consórcio não tem custo</text>
<text x="80" y="904" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">está mentindo.</text>
<text x="80" y="986" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">Existe taxa de administração — o preço</text>
<text x="80" y="1042" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">do serviço. A diferença é que ela é</text>
<text x="80" y="1098" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">fixa e sabida antes de assinar.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>