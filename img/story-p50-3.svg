<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="10" fill="#C9A34C"/>
<text x="80" y="300" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C" letter-spacing="4">O QUE NINGUÉM TE CONTA</text>
<text x="80" y="420" font-family="Helvetica,Arial,sans-serif" font-size="86" font-weight="bold" fill="#FFFFFF">Depois de</text>
<text x="80" y="522" font-family="Helvetica,Arial,sans-serif" font-size="86" font-weight="bold" fill="#FFFFFF">contemplado, a</text>
<text x="80" y="624" font-family="Helvetica,Arial,sans-serif" font-size="86" font-weight="bold" fill="#FFFFFF">parcela volta.</text>
<rect x="80" y="732" width="200" height="8" fill="#C9A34C"/>
<circle cx="96" cy="824" r="8" fill="#C9A34C"/>
<text x="130" y="836" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">A diferença que você pagou a menos</text>
<text x="130" y="886" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">é redistribuída nas parcelas que</text>
<text x="130" y="936" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">faltam.</text>
<circle cx="96" cy="1006" r="8" fill="#C9A34C"/>
<text x="130" y="1018" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">Ou seja: o valor total do contrato</text>
<text x="130" y="1068" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">não cai. O que muda é quando você</text>
<text x="130" y="1118" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">paga.</text>
<circle cx="96" cy="1188" r="8" fill="#C9A34C"/>
<text x="130" y="1200" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">É fôlego agora, não desconto no</text>
<text x="130" y="1250" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">fim.</text>
<text x="80" y="1420" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#C9A34C">Disponível em grupos específicos.</text>
<text x="80" y="1470" font-family="Helvetica,Arial,sans-serif" font-size="28" fill="#A8ADA2">Condição promocional para grupos de imóveis</text>
<text x="80" y="1510" font-family="Helvetica,Arial,sans-serif" font-size="28" fill="#A8ADA2">e veículos definidos pela administradora.</text>
<text x="80" y="1596" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#969690" opacity="0.8">VTR CONSÓRCIOS</text>
</svg>