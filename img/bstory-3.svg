<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="14" fill="#B3202A"/>
<rect x="0" y="14" width="1080" height="6" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="bold" fill="#C9A34C" letter-spacing="3">LEIA ANTES DE SE ANIMAR</text>
<text x="80" y="470" font-family="Helvetica,Arial,sans-serif" font-size="92" font-weight="bold" fill="#FFFFFF">Os 60% valem</text>
<text x="80" y="580" font-family="Helvetica,Arial,sans-serif" font-size="92" font-weight="bold" fill="#FFFFFF">até a</text>
<text x="80" y="690" font-family="Helvetica,Arial,sans-serif" font-size="92" font-weight="bold" fill="#FFFFFF">contemplação.</text>
<rect x="80" y="810" width="210" height="9" fill="#C9A34C"/>
<text x="80" y="920" font-family="Helvetica,Arial,sans-serif" font-size="46" font-weight="bold" fill="#C9A34C">Depois, a parcela volta ao</text>
<text x="80" y="980" font-family="Helvetica,Arial,sans-serif" font-size="46" font-weight="bold" fill="#C9A34C">valor cheio pelos meses</text>
<text x="80" y="1040" font-family="Helvetica,Arial,sans-serif" font-size="46" font-weight="bold" fill="#C9A34C">restantes.</text>
<text x="80" y="1140" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">O total do contrato não muda. O</text>
<text x="80" y="1190" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">que muda é quando você paga.</text>
<text x="80" y="1580" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#969690" opacity="0.8">VTR CONSÓRCIOS</text>
</svg>