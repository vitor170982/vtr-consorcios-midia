<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="12" fill="#B3202A"/>
<rect x="0" y="12" width="1080" height="5" fill="#C9A34C"/>
<text x="72" y="150" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#C9A34C" letter-spacing="3">UM EXEMPLO, COM NOMES AOS NÚMEROS</text>
<text x="72" y="260" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#FFFFFF">R$ 300 mil,</text>
<text x="72" y="340" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#FFFFFF">200 meses.</text>
<rect x="72" y="430" width="150" height="6" fill="#C9A34C"/>
<rect x="72" y="520" width="936" height="200" rx="12" fill="#1A3B35"/>
<text x="104" y="572" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#D6D2C8">PARCELA CHEIA</text>
<text x="104" y="648" font-family="Helvetica,Arial,sans-serif" font-size="54" font-weight="bold" fill="#FFFFFF">R$ 2.188,65</text>
<text x="104" y="690" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#9AA096">por mês, do início ao fim</text>
<text x="72" y="750" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" fill="#C9A34C">COM O BLACK NOVEMBRO, ATÉ CONTEMPLAR</text>
<rect x="72" y="774" width="936" height="250" rx="12" fill="#B3202A"/>
<text x="104" y="838" font-family="Helvetica,Arial,sans-serif" font-size="28" font-weight="bold" fill="#FFD9C8">PARCELA REDUZIDA</text>
<text x="104" y="930" font-family="Helvetica,Arial,sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF">R$ 875,46</text>
<text x="104" y="980" font-family="Helvetica,Arial,sans-serif" font-size="28" fill="#FFD9C8">economia de R$ 1.313,19 por mês</text>
<text x="72" y="1066" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#D6D2C8">Depois da contemplação, volta a R$ 2.188,65</text>
<text x="72" y="1106" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#D6D2C8">pelos meses restantes.</text>
<text x="72" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#969690" opacity="0.72">VTR CONSÓRCIOS</text>
<text x="1008" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#969690" opacity="0.72" text-anchor="end">4/7</text>
</svg>