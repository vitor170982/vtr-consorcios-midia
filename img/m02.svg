<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16" letter-spacing="4">O QUE É A ASSEMBLEIA</text>
<text x="80" y="490" font-family="Helvetica,Arial,sans-serif" font-size="88" font-weight="bold" fill="#1A2433">Todo mês</text>
<text x="80" y="602" font-family="Helvetica,Arial,sans-serif" font-size="88" font-weight="bold" fill="#1A2433">tem uma</text>
<text x="80" y="714" font-family="Helvetica,Arial,sans-serif" font-size="88" font-weight="bold" fill="#1A2433">reunião.</text>
<rect x="80" y="832" width="230" height="9" fill="#C9A34C"/>
<text x="80" y="936" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">Nela, quem é contemplado sai por</text>
<text x="80" y="992" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">sorteio ou lance.</text>
<text x="80" y="1074" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">Você não precisa estar presente —</text>
<text x="80" y="1130" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">mas pode acompanhar tudo pelo app</text>
<text x="80" y="1186" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#3A4553">da administradora.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>