<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="8" fill="#C9A34C"/>
<text x="72" y="150" font-family="Helvetica,Arial,sans-serif" font-size="58" font-weight="bold" fill="#AA5A16">3</text>
<text x="72" y="250" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#1A2433">Você tem crédito no</text>
<text x="72" y="330" font-family="Helvetica,Arial,sans-serif" font-size="68" font-weight="bold" fill="#1A2433">Brasil?</text>
<rect x="72" y="430" width="120" height="5" fill="#C9A34C"/>
<text x="72" y="498" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">Crédito não se constrói com salário em</text>
<text x="72" y="550" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">dólar. Se você nunca teve cartão ou</text>
<text x="72" y="602" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">conta ativa no Brasil, seu histórico lá</text>
<text x="72" y="654" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">é zero.</text>
<text x="72" y="732" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">E histórico zero significa menos opções</text>
<text x="72" y="784" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A4553">e condições piores para você.</text>
<rect x="72" y="850" width="6" height="6" fill="#C9A34C"/>
<text x="94" y="876" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16">Este é o ponto onde quase todo mundo</text>
<text x="94" y="922" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16">trava.</text>
<text x="72" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75">VTR CONSÓRCIOS</text>
<text x="1008" y="1268" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.75" text-anchor="end">3/9</text>
</svg>