<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="9" fill="#C9A34C"/>
<text x="72" y="150" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#C9A34C" letter-spacing="3">QUANTO CUSTA COMEÇAR</text>
<text x="72" y="300" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#D6D2C8">Crédito de R$ 100 mil, o menor da tabela</text>
<text x="64" y="480" font-family="Helvetica,Arial,sans-serif" font-size="200" font-weight="bold" fill="#FFFFFF">R$ 354</text>
<text x="72" y="542" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#C9A34C">por mês</text>
<rect x="72" y="630" width="180" height="7" fill="#C9A34C"/>
<text x="72" y="720" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#D6D2C8">É menos que muita gente paga de aluguel de</text>
<text x="72" y="768" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#D6D2C8">garagem nos EUA.</text>
<text x="72" y="842" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#D6D2C8">E ao contrário do aluguel, esse dinheiro</text>
<text x="72" y="890" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#D6D2C8">volta para você — em forma de carta de</text>
<text x="72" y="938" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#D6D2C8">crédito.</text>
<text x="72" y="1210" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#8C9187">Parcela reduzida do Plano 50 até a contemplação · depois volta ao valor cheio</text>
<text x="72" y="1240" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#8C9187">Prazo 200 meses · taxa 20,8% (média BC) · sujeito a grupos e cotas</text>
<text x="72" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#969690" opacity="0.72">VTR CONSÓRCIOS</text>
<text x="1008" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#969690" opacity="0.72" text-anchor="end">5/7</text>
</svg>