<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="9" fill="#C9A34C"/>
<text x="72" y="150" font-family="Helvetica,Arial,sans-serif" font-size="27" font-weight="bold" fill="#C9A34C" letter-spacing="3">QUANTO CUSTA COMEÇAR</text>
<text x="72" y="300" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#D6D2C8">Crédito de R$ 200 mil — o menor da tabela oficial</text>
<text x="70" y="470" font-family="Helvetica,Arial,sans-serif" font-size="170" font-weight="bold" fill="#FFFFFF">R$ 583,64</text>
<text x="72" y="536" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#C9A34C">por mês</text>
<rect x="72" y="620" width="180" height="7" fill="#C9A34C"/>
<text x="72" y="710" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#D6D2C8">Dá menos de R$ 20 por dia.</text>
<text x="72" y="784" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#D6D2C8">E ao contrário do aluguel, esse dinheiro</text>
<text x="72" y="832" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#D6D2C8">não vai embora: vira carta de crédito no</text>
<text x="72" y="880" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#D6D2C8">seu nome.</text>
<text x="72" y="1210" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#8C9187">Parcela reduzida do Plano 50 até a contemplação · depois volta ao valor cheio</text>
<text x="72" y="1240" font-family="Helvetica,Arial,sans-serif" font-size="21" fill="#8C9187">Prazo 200 meses · taxa de administração 18,36% · sujeito a grupos e cotas</text>
<text x="72" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#969690" opacity="0.72">VTR CONSÓRCIOS</text>
<text x="1008" y="1272" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="bold" fill="#969690" opacity="0.72" text-anchor="end">5/7</text>
</svg>