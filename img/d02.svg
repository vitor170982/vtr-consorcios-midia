<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#F6F3EC"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#AA5A16" letter-spacing="4">AS DUAS COLUNAS</text>
<text x="80" y="440" font-family="Helvetica,Arial,sans-serif" font-size="44" fill="#3A3A34">Toda parcela tem duas colunas:</text>
<text x="80" y="520" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A3A34">o que vira o seu crédito</text>
<text x="80" y="570" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#3A3A34">e o que remunera o serviço.</text>
<text x="80" y="720" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#0C2C27">Fundo comum</text>
<text x="80" y="775" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A3A34">vai para o seu crédito.</text>
<text x="80" y="890" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#0C2C27">Taxa de administração</text>
<text x="80" y="945" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A3A34">é o preço do serviço — e ela</text>
<text x="80" y="995" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A3A34">não cresce sobre si mesma como</text>
<text x="80" y="1045" font-family="Helvetica,Arial,sans-serif" font-size="34" fill="#3A3A34">o juro de um financiamento.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#696960" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>
