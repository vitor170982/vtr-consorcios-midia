<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C" letter-spacing="4">PRAZO OU PRESSA</text>
<text x="80" y="450" font-family="Helvetica,Arial,sans-serif" font-size="46" fill="#FFFFFF">O consórcio não escolhe</text>
<text x="80" y="515" font-family="Helvetica,Arial,sans-serif" font-size="46" fill="#FFFFFF">o seu ritmo.</text>
<text x="80" y="630" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">Se você tem pressa e não pode</text>
<text x="80" y="680" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">esperar, o financiamento resolve mais</text>
<text x="80" y="730" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">rápido — e custa mais caro.</text>
<text x="80" y="840" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">Se o prazo cabe na sua vida, você</text>
<text x="80" y="890" font-family="Helvetica,Arial,sans-serif" font-size="38" fill="#D6D2C8">paga menos por isso.</text>
<text x="80" y="1000" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#C9A34C">O barato que chega antes e o</text>
<text x="80" y="1045" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="bold" fill="#C9A34C">barato que chega depois.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#969690" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>
