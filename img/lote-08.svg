<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<rect width="1080" height="1920" fill="#0C2C27"/>
<rect x="0" y="0" width="1080" height="14" fill="#C9A34C"/>
<text x="80" y="330" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#C9A34C" letter-spacing="4">ANTES DE COMPRAR</text>
<text x="80" y="440" font-family="Helvetica,Arial,sans-serif" font-size="70" font-weight="bold" fill="#FFFFFF">Comece pelo</text>
<text x="80" y="524" font-family="Helvetica,Arial,sans-serif" font-size="70" font-weight="bold" fill="#FFFFFF">mais chato.</text>
<circle cx="96" cy="624" r="8" fill="#C9A34C"/>
<text x="130" y="638" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">CPF regular. Quem mora fora há anos</text>
<text x="130" y="684" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">deixa o CPF parado.</text>
<circle cx="96" cy="750" r="8" fill="#C9A34C"/>
<text x="130" y="764" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">Sem CPF em ordem você não abre conta,</text>
<text x="130" y="810" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">não assina contrato e não compra nada no</text>
<text x="130" y="856" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">seu nome.</text>
<circle cx="96" cy="922" r="8" fill="#C9A34C"/>
<text x="130" y="936" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#D6D2C8">Resolva isso antes de escolher o imóvel.</text>
<text x="80" y="1036" font-family="Helvetica,Arial,sans-serif" font-size="38" font-weight="bold" fill="#C9A34C">É o passo que mais atrasa quem mora</text>
<text x="80" y="1084" font-family="Helvetica,Arial,sans-serif" font-size="38" font-weight="bold" fill="#C9A34C">fora.</text>
<text x="80" y="1592" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="bold" fill="#969690" opacity="0.7">VTR CONSÓRCIOS</text>
</svg>